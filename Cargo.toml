[package]
name = "stac_service"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
aws-config = "1.13.0"
aws-sdk-s3 = "1.157.0"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
http = "1.5.0"
pgstac = "0.4.9"
reqwest = { version = "0.13.5", features = ["json"] }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stac = "0.17.7"
stac-client = "0.3.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = "0.7.18"
toml = "1.2.1"
url = "2.5.8"
